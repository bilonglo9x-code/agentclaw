name: Build GoClaw Fork Image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: goclaw-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bilonglo9x-code/agentclaw-goclaw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short,prefix=

      - name: Compile Go binaries
        run: |
          docker run --rm \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -v "$PWD/goclaw-server:/src" \
            -w /src \
            golang:1.26-bookworm \
            sh -euxc '
              go mod download
              mkdir -p internal/webui/dist
              [ -f internal/webui/dist/index.html ] || printf "<!doctype html>\n" > internal/webui/dist/index.html
              CGO_ENABLED=0 GOOS=linux go build -tags embedui -ldflags="-s -w -X github.com/nextlevelbuilder/goclaw/cmd.Version=${GITHUB_SHA}" -o /tmp/goclaw .
              CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /tmp/pkg-helper ./cmd/pkg-helper
            '

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: goclaw-server
          file: goclaw-server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ENABLE_EMBEDUI=true
            ENABLE_PYTHON=true
            ENABLE_FULL_SKILLS=false
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Coolify service
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_SERVICE_UUID" ]; then
            echo "Coolify secrets are not fully configured; skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            "$COOLIFY_URL/api/v1/services/$COOLIFY_SERVICE_UUID/restart?pull_latest_images=true"
