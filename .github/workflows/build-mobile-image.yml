name: Build GoClaw Mobile Web Image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "artifacts/goclaw-mobile/**"
      - "lib/api-client-react/**"
      - ".github/workflows/build-mobile-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mobile-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bilonglo9x-code/agentclaw-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/goclaw-mobile/Dockerfile
          push: true
          build-args: |
            EXPO_ROUTER_ORIGIN=https://mobile.vnsi.app
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Coolify mobile service
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_MOBILE_SERVICE_UUID: ${{ secrets.COOLIFY_MOBILE_SERVICE_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_MOBILE_SERVICE_UUID" ]; then
            echo "Coolify mobile secrets not configured; skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            "$COOLIFY_URL/api/v1/services/$COOLIFY_MOBILE_SERVICE_UUID/restart?pull_latest_images=true"
