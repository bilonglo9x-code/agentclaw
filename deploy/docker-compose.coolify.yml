services:
  postgres:
    image: pgvector/pgvector:pg18
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-goclaw}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goclaw} -d ${POSTGRES_DB:-goclaw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  goclaw:
    image: ghcr.io/bilonglo9x-code/agentclaw-goclaw:dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GOCLAW_PORT:-18790}:18790"
    environment:
      - GOCLAW_HOST=0.0.0.0
      - GOCLAW_PORT=18790
      - GOCLAW_CONFIG=/app/data/config.json
      - GOCLAW_POSTGRES_DSN=postgres://${POSTGRES_USER:-goclaw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goclaw}?sslmode=disable
      - GOCLAW_OWNER_IDS=${GOCLAW_OWNER_IDS:-mobile-gateway}
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN:?GOCLAW_GATEWAY_TOKEN is required}
      - GOCLAW_ENCRYPTION_KEY=${GOCLAW_ENCRYPTION_KEY:?GOCLAW_ENCRYPTION_KEY is required}
      - GOCLAW_SKILLS_DIR=/app/data/skills
    volumes:
      - goclaw-data:/app/data
      - goclaw-workspace:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.http.middlewares.goclaw-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.goclaw-cors.headers.accesscontrolallowheaders=Authorization,Content-Type,X-GoClaw-Tenant-Id,X-GoClaw-User-Id"
      - "traefik.http.middlewares.goclaw-cors.headers.accesscontrolalloworiginlist=https://mobile.vnsi.app,https://agent.vnsi.app"
      - "traefik.http.middlewares.goclaw-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.goclaw-cors.headers.addvaryheader=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  goclaw-data:
  goclaw-workspace:
